changelog:
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Internal
      labels:
        - chore
        - refactor
        - ci
        - test
        - build
    - title: Other Changes
      labels:
        - "*"
