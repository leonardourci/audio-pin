name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift via swiftly
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes --quiet-shell-followup
          swiftly install --assume-yes
          swiftly use
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
