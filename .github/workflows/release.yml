name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for [$VERSION]. Add one before merging to release." >&2
            exit 1
          fi
          # Trim leading/trailing blank lines
          sed -i '' -e '/./,$!d' RELEASE_NOTES.md 2>/dev/null || sed -i -e '/./,$!d' RELEASE_NOTES.md
          echo "----- Release notes -----"
          cat RELEASE_NOTES.md

      - name: Abort if tag already exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump VERSION before merging to release." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin. Bump VERSION before merging to release." >&2
            exit 1
          fi

      - name: Install Swift via swiftly
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes --quiet-shell-followup
          swiftly install --assume-yes
          swiftly use
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: swift build -c release --product AudioPin

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP="AudioPin.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp .build/release/AudioPin "$APP/Contents/MacOS/AudioPin"
          cp Sources/AudioPin/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/AudioPin"

      - name: Ad-hoc codesign
        run: |
          # Unsigned builds get "AudioPin is damaged and cannot be opened" on
          # download due to quarantine. Ad-hoc signature reduces the friction;
          # users may still need to strip the quarantine xattr the first time.
          codesign --force --deep --sign - AudioPin.app
          codesign --verify --deep --strict AudioPin.app

      - name: Zip .app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent AudioPin.app "AudioPin-${{ steps.ver.outputs.version }}.zip"

      - name: Create and push tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
          draft: false
          prerelease: false
          files: AudioPin-${{ steps.ver.outputs.version }}.zip
